[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dengine"
version = "2.0"
description = "dEngine - Decentralized Learning Engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib",
    "networkx",
    "npy-append-array",
    "numpy",
    "omegaconf",
    "pandas",
    "pillow",
    "pydantic",
    "scikit-learn",
    "torch",
    "torchvision",
    "tqdm",
    "httpx"
]

[project.optional-dependencies]
dev = [
    "Mako"
]
serve = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pyjwt"
]
full = [
    "dengine[dev,serve]",
    "transformers"
]

[tool.setuptools]
py-modules = ["_dengine_cli_paths"]

[tool.setuptools.packages.find]
include = ["dengine*"]

[tool.setuptools.data-files]
"share/dengine/configs" = [
  "configs/*.*",
  "configs/**/*.*"
]

[project.scripts]
dengine-simulate = "dengine.bin.simulation:_cli"
dengine-validate = "dengine.bin.validate_config:main"
dengine-serve = "dengine.bin.serve:_main"
